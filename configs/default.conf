server {
    listen 9999;
    server_name hola.com;
    error_page 404 403 =302 http://localhost:9999/error/404.html;
    #error_page 403 =302 http://localhost:9999/error/403.html;
    #error_page 404 =302 /error/404.html;
    #error_page 403 =302 /error/403.html;
    #error_page 404 jfdsladf;
	root ./www/pavicent;
	index index.html;
    cgi .pl /usr/bin/perl;
	autoindex off;
    location /images {
        #alias /img;
        root /usr/home;
        #index index.html index.php;
        # Nota: php-cgi no está instalado en todas las máquinas; si no existe, el parser falla.
        #cgi .php /usr/bin/php-cgi; Cambiar en MAC
    }
	location /upload {
        #alias /img;
       	autoindex on;
		#cgi .php /usr/bin/php-cgi; Cambiar en MAC
		allowed_methods GET POST DELETE;
    }
	location /cgi-bin {
    	#root ./www/pavicent/cgi-bin;
    	cgi .py /usr/bin/python3;
    	#cgi .sh /bin/bash;        # opcional: habilita .sh como CGI si lo deseas
    	allowed_methods GET POST;
    	autoindex on;
	}
	location /prueba {
		allowed_methods GET;
		alias ./www/pavicent/static;
		index empty.html;
	}
	location /force-403 {
	    alias /home/pavicent/webalberto/www/eg_delacruz;   # ejemplo: apunta a algo fuera de web root
	    index index.html;
	}
	location /force-404 {
		allowed_methods GET;
		# alias to a file that does NOT exist so a GET returns 404
		alias ./www/pavicent/error/nonexistent-404.html;
	}
	location /force-405 {
    	allowed_methods POST;
    	alias ./www/pavicent/static;
    	index empty.html;
	}
	location /force-413 {
		allowed_methods POST;
		client_max_body_size 1;
	}
	location /force-201 {
		allowed_methods POST;
		# map to the upload directory so a POST creating a new file returns 201
		alias ./www/pavicent/upload;
	}
		# Location para probar DELETE sobre un recurso que está fuera del `root` de este server
	# Petición de prueba: DELETE http://localhost:9999/delete-outside
	location /delete-outside {
		# alias a un fichero que está fuera de ./www/pavicent (server root)
		# Línea original (otra máquina):
		alias ./www/eg_delacruz/upload/borrar.txt;
		# Línea funcional en este repo:
		#alias ./www/eg_delacruz/upload/borrar.txt;
		allowed_methods DELETE;
		autoindex off;
	}
}

