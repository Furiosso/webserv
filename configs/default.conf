server {
    listen 9999;
    server_name hola.com;
    error_page 404 =200 jfdksladf;
    #plo0kerror_page 404 jfdsladf;
	root ./www/jfercode;
	index index.html;
    cgi .pl /usr/bin/perl;
	autoindex off;
    location /images {
        #alias /img;
        root /usr/home;
        #index index.html index.php;
        cgi .php /usr/bin/php-cgi;
    }
	location /upload {
        #alias /img;
       	autoindex on;
        cgi .php /usr/bin/php-cgi;
		allowed_methods GET POST DELETE;
    }
	location /cgi-bin {
    	#root ./www/jfercode/cgi-bin;
    	cgi .py /usr/bin/python3;
    	#cgi .sh /bin/bash;        # opcional: habilita .sh como CGI si lo deseas
    	allowed_methods GET POST;
    	autoindex off;
	}

    # Location para probar DELETE sobre un recurso que está fuera del `root` de este server
    # Petición de prueba: DELETE http://localhost:9999/delete-outside
    location /delete-outside {
        # alias a un fichero que está fuera de ./www/jfercode (server root)
        alias /home/pavicent/webserv/www/eg_delacruz/upload/borrar.txt;
        allowed_methods DELETE;
        autoindex off;
    }
}

server {
    listen 127.42.42.42:4242;
    server_name adios.com;
    #autoindex on;
    client_max_body_size 15k;
    error_page 404 =201 eeee;
	root ./www/eg_delacruz;
    #alias /home/pavicent;
    cgi .py /usr/bin/python3;
    location / {
		#alias /home/dagimeno;
        #root /home/dagimeno;
        index index.html index.php;
		cgi .py /usr/bin/python3;
		allowed_methods POST GET DELETE;
    	error_page 404 =201 eeee;
		#autoindex off;
    }
    #server_name adios.com;
}

