server {
    listen 100.0.0.254:21 ;
    server_name hola.com;
    error_page 404 =200;
	root $PWD/html/;
	index index.html index.php;
    location / {
        index index.html index.php;
    }
}

server {
   listen 255.1.1.1;
    server_name adios.com;
    autoindex on;
    client_max_body_size 15K;
	root $PWD;
    cgi_pass pl /usr/bin/perl;
    location /hola {
		root /hola;
        index index.html index.php;
		cgi_pass py /bin/py;
    }
    server_name adios.com;
}

server
{
    listen 8080;
}