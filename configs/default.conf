server {
    listen 9999;
    server_name hola.com;
    error_page 404 =200 jfdksladf;
#	root $PWD/html/;
	index index.html index.php;
    location /usr {
        index index.html index.php;
        cgi .php /usr/bin/php-cgi;
    }
    allowed_methods GET DELETE;
}

server {
    listen 127.0.23.67;
    server_name adios.com;
    autoindex on;
    client_max_body_size 15g;
    error_page 404 =201 eeee;
	root /home/dagimeno;
    #alias /home/pavicent;
    cgi .pl /usr/bin/perl;
    location / {
		alias /usr/bin;
        #root /usr/bin;
        index index.html index.php;
		cgi .py /usr/bin/python3;
		allowed_methods GET DELETE;
    	error_page 404 =201 eeee;
		autoindex on;
    }
    server_name adios.com;
}

