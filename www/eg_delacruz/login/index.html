<!DOCTYPE html>
<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Login Page</title>
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
			rel="stylesheet"
		/>
		<script>
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						colors: {
							primary: "#005A9C",
							"background-light": "#F0F2F5",
							"background-dark": "#101922",
							accent: "#007BFF",
						},
						fontFamily: {
							display: ["Inter", "sans-serif"],
						},
						borderRadius: {
							DEFAULT: "0.25rem",
							lg: "0.5rem",
							xl: "0.75rem",
							full: "9999px",
						},
					},
				},
			};
		</script>
		<style>
			.form-input {
				background-color: #f0f2f5;
				color: #333333;
			}
			.dark .form-input {
				background-color: #233648;
				color: white;
			}
			.dark .form-input::placeholder {
				color: #92adc9;
			}
			.form-input::placeholder {
				color: #666666;
			}
		</style>
	</head>
	<body class="bg-background-light dark:bg-background-dark font-display">
		<div
			class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden"
		>
			<div class="layout-container flex h-full grow flex-col">
				<div class="px-4 flex flex-1 justify-center items-center py-5">
					<div
						class="layout-content-container flex flex-col max-w-[480px] flex-1"
					>
						<div class="flex flex-col gap-8 p-4">
							<a
								class="absolute top-4 left-4 flex items-center gap-2 text-gray-800 dark:text-white hover:text-accent dark:hover:text-accent transition-colors"
								href="/"
							>
								<span class="material-symbols-outlined"
									>arrow_back</span
								>
								<span class="text-sm font-medium">Go Back</span>
							</a>
							<div class="flex flex-col items-center gap-4 pt-10">
								<svg
									class="w-12 h-12 text-primary"
									fill="none"
									stroke="currentColor"
									stroke-width="1.5"
									viewBox="0 0 24 24"
									xmlns="http://www.w3.org/2000/svg"
								>
									<path
										d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
										stroke-linecap="round"
										stroke-linejoin="round"
									></path>
								</svg>
								<p
									class="text-gray-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em] min-w-72 text-center"
								>
									Welcome Back
								</p>
							</div>
							<div class="flex flex-col gap-4">
								<form method="POST" action="/">
	<label class="flex flex-col min-w-40 flex-1">
									<p
										class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2"
									>
										Username or Email
									</p>
									<input
										class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg focus:outline-none focus:ring-2 focus:ring-accent border-none h-14 p-4 text-base font-normal leading-normal"
										placeholder="Enter your username or email"
										name="username"
									/>
								</label>
								<label class="flex flex-col min-w-40 flex-1">
									<p
										class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2"
									>
										Password
									</p>
									<div
										class="flex w-full flex-1 items-stretch rounded-lg"
									>
										<input
											class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg focus:outline-none focus:ring-2 focus:ring-accent border-none h-14 p-4 rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal"
											placeholder="Enter your password"
											type="password"
											name="password"
										/>
										<div
											class="flex items-center justify-center pr-4 rounded-r-lg border-l-0 text-gray-500 dark:text-[#92adc9] bg-[#F0F2F5] dark:bg-[#233648]"
										>
											<span
												class="material-symbols-outlined cursor-pointer"
												>visibility_off</span
											>
										</div>
									</div>
								</label>
							</div>
							<p
								class="text-accent text-sm font-normal leading-normal pb-3 pt-1 px-4 text-right underline cursor-pointer"
							>
								Forgot Password?
							</p>
							<button
								type="submit"
								class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-opacity-90 transition-colors"
							>
								<span class="truncate">Log In</span>
							</button>

								</form>
							
							<div class="flex items-center gap-4 px-4">
								<hr
									class="flex-grow border-gray-300 dark:border-gray-600"
								/>
								<p
									class="text-gray-600 dark:text-gray-400 text-sm"
								>
									Or log in with
								</p>
								<hr
									class="flex-grow border-gray-300 dark:border-gray-600"
								/>
							</div>
							<div class="flex gap-4 justify-center">
								<button
									class="flex items-center justify-center w-12 h-12 bg-background-light dark:bg-[#233648] rounded-full border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
								>
									<svg
										class="w-6 h-6"
										fill="currentColor"
										viewBox="0 0 24 24"
										xmlns="http://www.w3.org/2000/svg"
									>
										<path
											d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09Z"
										></path>
										<path
											d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z"
										></path>
										<path
											d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62Z"
										></path>
										<path
											d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53Z"
										></path>
									</svg>
								</button>
								<button
									class="flex items-center justify-center w-12 h-12 bg-background-light dark:bg-[#233648] rounded-full border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
								>
									<svg
										class="w-6 h-6"
										fill="currentColor"
										viewBox="0 0 24 24"
										xmlns="http://www.w3.org/2000/svg"
									>
										<path
											d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.91 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
										></path>
									</svg>
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
