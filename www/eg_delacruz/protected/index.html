<!DOCTYPE html>

<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Protected Area</title>
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
			rel="stylesheet"
		/>
		<style>
			.material-symbols-outlined {
				font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0,
					"opsz" 24;
			}
		</style>
		<script id="tailwind-config">
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						colors: {
							primary: "#1173d4",
							"background-light": "#f6f7f8",
							"background-dark": "#101922",
						},
						fontFamily: {
							display: ["Inter", "sans-serif"],
						},
						borderRadius: {
							DEFAULT: "0.25rem",
							lg: "0.5rem",
							xl: "0.75rem",
							full: "9999px",
						},
					},
				},
			};
		</script>
	</head>
	<body class="bg-background-light dark:bg-background-dark font-display">
		<div
			class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden"
		>
			<div class="layout-container flex h-full grow flex-col">
				<div class="flex flex-1 justify-center">
					<div
						class="layout-content-container flex flex-col max-w-[960px] flex-1"
					>
						<!-- /////////////////////////// -->
						<!-- //       Header          // -->
						<!-- /////////////////////////// -->
						<header
							class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-white/10 px-4 sm:px-10 py-3"
						>
							<div class="flex items-center gap-4 text-white">
								<img
									alt="Logo"
									class="w-8 h-8"
									src="/static/Logo.svg"
								/>
								<h2
									class="text-white text-lg font-bold leading-tight tracking-[-0.015em]"
								>
									Gerardo De La Cruz
								</h2>
							</div>
							<div class="flex">
								<a
									href="/"
									class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors mx-2"
								>
									<span class="truncate"> Go back </span>
								</a>
								<a
									href="/"
									class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors mx-2"
								>
									<span class="truncate"> Logout </span>
								</a>
							</div>
						</header>
						<main
							class="flex flex-col items-center justify-center flex-grow py-20 px-4"
						>
							<h1
								class="text-gray-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-3 pt-6"
							>
								Protected Area
							</h1>
							<p
								class="text-gray-600 dark:text-gray-300 text-base font-normal leading-normal pb-3 pt-1 text-center max-w-md"
							>
								This is a secure, members-only section of the
								website. It is a demonstration of the
								authentication system.
							</p>
							<p
								class="text-gray-500 dark:text-[#92adc9] text-sm font-normal leading-normal pb-6 pt-1 text-center"
							>
								Logged in
							</p>
							<div class="flex justify-center">
								<a
									href="/logout"
									class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em]"
								>
									<span class="truncate">Logout</span>
								</a>
							</div>
						</main>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
